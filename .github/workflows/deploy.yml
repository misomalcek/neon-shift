name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages-deploy'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.9.0'

      - name: Show Node/npm versions
        run: |
          node -v
          npm -v

      - name: Remove old gh-pages branch (if present)
        run: |
          set -e
          git fetch origin
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "gh-pages branch exists on origin — deleting to avoid conflicting publishes"
            git push origin --delete gh-pages || echo "delete failed or no permission"
          else
            echo "no gh-pages branch on origin"
          fi

      - name: Install dependencies
        run: |
          # Use npm ci if a lockfile exists, otherwise fall back to npm install
          if [ -f package-lock.json ]; then
            echo "package-lock.json found, running npm ci"
            npm ci --prefer-offline --no-audit
          else
            echo "No lockfile found, running npm install"
            npm install --no-audit --prefer-offline
          fi

      - name: Build
        run: |
          set -e
          npm run build
          echo "---- build root listing ----"
          ls -la
          echo "---- check out/ ----"
          if [ -d out ]; then
            echo "out/ exists"
            ls -la out | sed -n '1,200p'
          else
            echo "out/ not found — next build didn't produce a static export (output: 'export' expected)"
            exit 1
          fi

      - name: Ensure .nojekyll
        if: success()
        run: echo "" > out/.nojekyll

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
